<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Website</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .home-section {
            padding: 60px 0;
            background-color: #f8f9fa;
            text-align: center;
        }
        .home-section img {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }
        footer {
            background-color: #212529;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">My College</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="departmentDropdown" role="button" data-bs-toggle="dropdown">
            Department
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">CSE</a></li>
            <li><a class="dropdown-item" href="#">AIML</a></li>
            <li><a class="dropdown-item" href="#">DS</a></li>
            <li><a class="dropdown-item" href="#">IT</a></li>
            <li><a class="dropdown-item" href="#">ME</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Home Section with Circular Images -->
<section class="home-section">
    <div class="container">
        <h2 class="mb-5">Welcome to Our Departments</h2>
        <div class="row justify-content-center">
            <div class="col-md-3 mb-4">
                <img src="https://via.placeholder.com/200" class="rounded-circle img-fluid" alt="CSE">
                <h5 class="mt-3">CSE</h5>
            </div>
            <div class="col-md-3 mb-4">
                <img src="https://via.placeholder.com/200" class="rounded-circle img-fluid" alt="AIML">
                <h5 class="mt-3">AIML</h5>
            </div>
            <div class="col-md-3 mb-4">
                <img src="https://via.placeholder.com/200" class="rounded-circle img-fluid" alt="DS">
                <h5 class="mt-3">DS</h5>
            </div>
            <div class="col-md-3 mb-4">
                <img src="https://via.placeholder.com/200" class="rounded-circle img-fluid" alt="IT">
                <h5 class="mt-3">IT</h5>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer>
    <div class="container">
        <p class="mb-0">© 2026 My College | All Rights Reserved</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
